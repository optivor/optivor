services:
  optivor:
    image: optivor:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./optivor.yaml.example:/etc/optivor/optivor.yaml:ro
    environment:
      - OPTIVOR_STORAGE_S3_SECRET_ACCESS_KEY=${SECRET_ACCESS_KEY:-minioadmin}
      - OPTIVOR_AUTH_SECRET=${AUTH_SECRET:-defaultsecret}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - minio

  minio:
    image: minio/minio:RELEASE.2024-01-31T02-03-41Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
