version: 2
project_name: optivor

builds:
  - id: optivor-linux-amd64
    main: ./cmd/optivor
    binary: optivor
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-linux-gnu
      - CXX=zig c++ -target x86_64-linux-gnu
    goos:
      - linux
    goarch:
      - amd64

  - id: optivor-linux-arm64
    main: ./cmd/optivor
    binary: optivor
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-linux-gnu
      - CXX=zig c++ -target aarch64-linux-gnu
    goos:
      - linux
    goarch:
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

nfpms:
  - id: optivor-nfpms
    package_name: optivor
    vendor: Optivor
    homepage: "https://github.com/optivor/optivor"
    maintainer: "Optivor Maintainers"
    description: "Production-grade image infrastructure framework"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    files:
      "deploy/systemd/optivor.service": "/lib/systemd/system/optivor.service"
      "optivor.yaml.example": "/etc/optivor/optivor.yaml.example"
