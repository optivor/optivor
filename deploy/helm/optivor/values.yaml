# Default values for optivor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: optivor/optivor
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: optivor.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: optivor-tls
  #    hosts:
  #      - optivor.local

resources:
  # Limits are crucial because libvips is heavy on multi-threaded CPU and memory
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Optivor Core Application Configuration
config:
  server:
    read_timeout: 30s
    write_timeout: 30s
    request_timeout: 30s
    log_level: info
    log_format: json

  # Global S3 credentials (used if buckets list is empty)
  storage:
    driver: s3
    s3:
      endpoint: ""
      bucket: ""
      region: us-east-1
      # Leave empty if using secretRef
      access_key_id: ""
      secret_access_key: ""

  # Define multiple storage buckets (highly recommended for production)
  # If defined, this overrides global storage configuration
  buckets: []
  # - name: "main-bucket"
  #   provider: "s3"
  #   endpoint: "https://s3.amazonaws.com"
  #   bucket: "my-optivor-bucket"
  #   region: "us-east-1"
  #   access_key_id: ""
  #   secret_access_key: ""
  #   access: "public"

  # Cache configuration (FS LRU or Redis)
  cache:
    type: fs  # "fs" or "redis"
    fs:
      dir: /tmp/optivor-cache
      max_size_mb: 1024
      # Set to true to create a PersistentVolumeClaim to persist filesystem cache across pod lifecycle
      persistence:
        enabled: false
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 10Gi
    redis:
      # Address of Redis host
      addr: "redis-master:6379"
      password: ""
      db: 0
      prefix: "optivor:cache:"
      ttl: 24h

  image:
    contain_background_color: "#ffffff"
    max_pixels: 25000000
    max_decode_mb: 64

  auth:
    signed_urls:
      enabled: false
      secret: ""
      max_age: 3600

  telemetry:
    enabled: false
    otlp_endpoint: ""
    service_name: optivor
    sampling_ratio: 1.0

  remote:
    enabled: true
    allowed_domains:
      - "*"

  presets: {}
  #   avatar:
  #     w: 150
  #     h: 150
  #     f: webp
  #     fit: cover

  crawler:
    enabled: true
    max_concurrency_per_variant: 10

# External Secret Reference
# If you prefer to supply S3 credentials, Redis password, and signed URL secrets
# from an existing Kubernetes Secret instead of values.yaml.
# Secret must contain:
# - OPTIVOR_STORAGE_S3_ACCESS_KEY_ID (if using global storage)
# - OPTIVOR_STORAGE_S3_SECRET_ACCESS_KEY (if using global storage)
# - OPTIVOR_CACHE_REDIS_PASSWORD (if using redis cache and password required)
# - OPTIVOR_AUTH_SIGNED_URLS_SECRET (if auth is enabled)
existingSecret: ""
