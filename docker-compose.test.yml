version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: optivor-minio-test
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
