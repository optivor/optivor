name: CI

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

permissions:
  contents: read
  checks: write

jobs:
  test-go:
    name: Go Engine (Build, Test & Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libheif-dev

      - name: Run Build
        run: go build ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

      - name: Run Unit Tests
        run: go test ./... -race -cover

      - name: Run Benchmarks
        run: go test ./test/e2e -bench=. -benchmem -run=^$

  test-sdks:
    name: Client SDKs (JS, React, Vue, Python, PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test JS SDK
        run: |
          cd packages/js
          npm test || true

      - name: Test Python SDK Build
        run: |
          cd packages/python
          pip install build
          python -m build
