name: CI

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libheif-dev

      - name: Run Build
        run: go build ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v1.64.0
          args: --timeout=5m

      - name: Run Unit Tests
        run: go test ./... -race -cover

      - name: Run Benchmarks
        run: go test ./test/e2e -bench=. -benchmem -run=^$
